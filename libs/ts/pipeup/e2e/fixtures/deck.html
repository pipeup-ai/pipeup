<!doctype html>
<!-- A class-toggled deck like the Try deck: one slide shows at a time, cross-fading. window.deck drives it. -->
<html
  lang="en"
  data-pipeup-doc="dEcKfIxTuRe00001:DDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDD"
  data-pipeup-auto="off"
>
  <head>
    <meta charset="utf-8" />
    <title>Deck</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        background: #f1efe8;
        font:
          18px/1.5 system-ui,
          sans-serif;
      }
      .deck {
        width: 900px;
        height: 506px;
        position: relative;
      }
      .slide {
        position: absolute;
        inset: 0;
        background: #fff;
        padding: 48px;
        box-sizing: border-box;
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 0.34s cubic-bezier(0.4, 0, 0.2, 1),
          visibility 0s linear 0.34s;
      }
      .slide.on {
        opacity: 1;
        visibility: visible;
        transition-delay: 0s;
      }
      .bars {
        display: flex;
        gap: 18px;
        align-items: flex-end;
        height: 200px;
      }
      .bars div {
        flex: 1;
        background: #d3d1c7;
      }
      .controls {
        position: fixed;
        bottom: 20px;
        left: 20px;
        display: flex;
        gap: 10px;
      }
    </style>
  </head>
  <body>
    <div class="deck">
      <section class="slide on" data-pipeup-slide="1" data-pipeup-id="s1">
        <h1>Q3 review</h1>
        <p id="s1p">Growth, retention and what we change in Q4.</p>
        <div id="s1box" data-pipeup-id="s1-box" style="height: 60px; background: #eee">Box</div>
      </section>
      <section class="slide" data-pipeup-slide="2" data-pipeup-id="s2">
        <h2>Revenue grew 42%</h2>
        <div class="bars" data-pipeup-id="s2-chart" data-pipeup-label="Revenue by quarter">
          <div style="height: 50%" data-pipeup-id="s2-q3" data-pipeup-label="Q3 bar"></div>
          <div style="height: 100%" data-pipeup-id="s2-q4" data-pipeup-label="Q4 bar"></div>
        </div>
      </section>
      <section class="slide" data-pipeup-slide="3" data-pipeup-id="s3">
        <h2>Next quarter</h2>
        <p id="s3p">Hire a second designer and hold churn under 3%.</p>
      </section>
    </div>
    <footer id="foot">Confidential</footer>
    <div class="controls" data-pipeup-ignore>
      <button id="prev" aria-label="Previous slide">←</button>
      <span id="count">1 / 3</span>
      <button id="next" aria-label="Next slide">→</button>
    </div>
    <script src="../../dist/pipeup.min.js"></script>
    <script>
      window.deck = {
        at: 0,
        slides: [...document.querySelectorAll(".slide")],
        go(i) {
          this.at = Math.max(0, Math.min(this.slides.length - 1, i));
          this.slides.forEach((s, k) => s.classList.toggle("on", k === this.at));
          document.getElementById("count").textContent = `${this.at + 1} / ${this.slides.length}`;
        },
      };
      document.getElementById("prev").onclick = () => deck.go(deck.at - 1);
      document.getElementById("next").onclick = () => deck.go(deck.at + 1);
      addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight") deck.go(deck.at + 1);
        if (e.key === "ArrowLeft") deck.go(deck.at - 1);
      });
    </script>
  </body>
</html>
