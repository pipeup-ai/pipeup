<!doctype html>
<!-- A deck laid out for phones: one slide fills the screen at a time, cross-fading, above the deck's own
     "← 1 / 3 →" bar at the bottom centre, which is marked for Pipeup to leave alone. window.deck drives it. -->
<html
  lang="en"
  data-pipeup-doc="pHoNeDeCk0000001:QQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQ"
  data-pipeup-auto="off"
>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pocket deck</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #f1efe8;
        font:
          18px/1.5 system-ui,
          sans-serif;
        color: #222;
      }
      .slide {
        position: fixed;
        inset: 0 0 72px;
        padding: 24px;
        box-sizing: border-box;
        background: #fff;
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 0.34s cubic-bezier(0.4, 0, 0.2, 1),
          visibility 0s linear 0.34s;
      }
      .slide.on {
        opacity: 1;
        visibility: visible;
        transition-delay: 0s;
      }
      .bar {
        position: fixed;
        left: 50%;
        bottom: 12px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 4px 8px;
        border-radius: 999px;
        background: #2c2c2a;
        color: #fff;
        font-size: 14px;
      }
      .bar button {
        min-width: 44px;
        min-height: 44px;
        border: 0;
        background: none;
        color: inherit;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <section class="slide on" data-pipeup-slide="1" data-pipeup-id="s1">
      <h1>Q3 review</h1>
      <p id="s1p">Growth, retention and what we change in Q4.</p>
    </section>
    <section class="slide" data-pipeup-slide="2" data-pipeup-id="s2">
      <h2>Revenue grew 42%</h2>
      <p id="s2p">Most of it came from the annual plan.</p>
    </section>
    <section class="slide" data-pipeup-slide="3" data-pipeup-id="s3">
      <h2>Next quarter</h2>
      <p id="s3p">Hire a second designer and hold churn under 3%.</p>
    </section>
    <nav class="bar" id="bar" data-pipeup-ignore>
      <button id="prev" aria-label="Previous slide">←</button>
      <span id="count">1 / 3</span>
      <button id="next" aria-label="Next slide">→</button>
    </nav>
    <script src="../../dist/pipeup.min.js"></script>
    <script>
      window.deck = {
        at: 0,
        slides: [...document.querySelectorAll(".slide")],
        go(i) {
          this.at = Math.max(0, Math.min(this.slides.length - 1, i));
          this.slides.forEach((s, k) => s.classList.toggle("on", k === this.at));
          document.getElementById("count").textContent = `${this.at + 1} / ${this.slides.length}`;
        },
      };
      document.getElementById("prev").onclick = () => deck.go(deck.at - 1);
      document.getElementById("next").onclick = () => deck.go(deck.at + 1);
    </script>
  </body>
</html>
