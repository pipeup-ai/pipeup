<!doctype html>
<!-- A deck designed for review: one element per slide, marked with data-pipeup-slide; the slide controls
     are marked data-pipeup-ignore so they keep working in comment mode. Comment on a slide's text, or
     press Shift+Alt+C (Shift+Option+C on a Mac) and click a block to comment on it, or Option-click to pin a spot.
     Slide-aware commenting (only the current slide's comments, jumping to a comment's slide) comes in
     0.4; for now comments on hidden slides simply aren't shown until their slide is.
     Open it from disk after `npm run build`. The doc key below is a sample; `pipeup init` makes a real one. -->
<html lang="en" data-pipeup-doc="eXaMpLeDeCk00001:KKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKK">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Q3 review — deck</title>
    <style>
      body { margin: 0; height: 100vh; display: grid; place-items: center; background: #f1efe8; font: 18px/1.5 system-ui, -apple-system, sans-serif; color: #1d1d1f; }
      .deck { width: min(92vw, 960px); aspect-ratio: 16 / 9; position: relative; }
      .slide { position: absolute; inset: 0; background: #fff; border-radius: 16px; padding: 56px 64px; box-sizing: border-box; opacity: 0; visibility: hidden; transition: opacity 0.34s cubic-bezier(0.4, 0, 0.2, 1), visibility 0s linear 0.34s; }
      .slide.on { opacity: 1; visibility: visible; transition-delay: 0s; }
      .slide h1 { font-size: 44px; margin: 0 0 12px; letter-spacing: -0.02em; }
      .slide h2 { font-size: 32px; margin: 0 0 20px; }
      .bars { display: flex; gap: 18px; align-items: flex-end; height: 220px; }
      .bars div { flex: 1; background: #d3d1c7; border-radius: 6px 6px 0 0; }
      .bars .hi { background: #534ab7; }
      .controls { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; align-items: center; background: #fff; border-radius: 999px; padding: 6px 10px; }
      .controls button { border: 0; background: none; font: inherit; cursor: pointer; padding: 4px 10px; }
    </style>
  </head>
  <body>
    <div class="deck">
      <section class="slide on" data-pipeup-slide="1" data-pipeup-id="s1-title">
        <h1>Q3 review</h1>
        <p>Growth, retention and what we'll change in Q4.</p>
      </section>
      <section class="slide" data-pipeup-slide="2" data-pipeup-id="s2-revenue">
        <h2>Revenue grew 42% year on year</h2>
        <div class="bars" data-pipeup-id="s2-chart" data-pipeup-label="Revenue by quarter">
          <div style="height: 45%" data-pipeup-id="s2-q1" data-pipeup-label="Q1 bar"></div>
          <div style="height: 58%" data-pipeup-id="s2-q2" data-pipeup-label="Q2 bar"></div>
          <div style="height: 71%" data-pipeup-id="s2-q3" data-pipeup-label="Q3 bar"></div>
          <div class="hi" style="height: 100%" data-pipeup-id="s2-q4" data-pipeup-label="Q4 bar"></div>
        </div>
      </section>
      <section class="slide" data-pipeup-slide="3" data-pipeup-id="s3-next">
        <h2>Next quarter</h2>
        <ul>
          <li>Ship offline reading to everyone.</li>
          <li>Hire a second designer.</li>
          <li>Hold churn under 3%.</li>
        </ul>
      </section>
    </div>
    <div class="controls" data-pipeup-ignore>
      <button id="prev" aria-label="Previous slide">←</button>
      <span id="count">1 / 3</span>
      <button id="next" aria-label="Next slide">→</button>
    </div>
    <script>
      const slides = [...document.querySelectorAll(".slide")];
      let n = 0;
      function go(i) {
        n = Math.max(0, Math.min(slides.length - 1, i));
        slides.forEach((s, k) => s.classList.toggle("on", k === n));
        document.getElementById("count").textContent = `${n + 1} / ${slides.length}`;
      }
      document.getElementById("prev").onclick = () => go(n - 1);
      document.getElementById("next").onclick = () => go(n + 1);
      addEventListener("keydown", (e) => {
        if (e.target.closest?.("input,textarea,[contenteditable]")) return;
        if (e.key === "ArrowRight") go(n + 1);
        if (e.key === "ArrowLeft") go(n - 1);
      });
    </script>
    <script src="../dist/pipeup.min.js"></script>
  </body>
</html>
