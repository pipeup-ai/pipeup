name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: libs/ts/pipeup
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: libs/ts/pipeup/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run check
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            libs/ts/pipeup/playwright-report
            libs/ts/pipeup/test-results
          if-no-files-found: ignore

  addons:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            libs/ts/pipeup/package-lock.json
            libs/ts/addons/package-lock.json
      # The add-ons are written against the core's types and built into combined files with its classic build.
      - run: npm ci && npm run build
        working-directory: libs/ts/pipeup
      - run: npm ci
        working-directory: libs/ts/addons
      - run: npx playwright install --with-deps chromium
        working-directory: libs/ts/addons
      - run: npm run check
        working-directory: libs/ts/addons
      - name: Mailbox reference server
        working-directory: services/mailbox
        run: |
          npm test
          ../../libs/ts/addons/node_modules/.bin/eslint .
          ../../libs/ts/addons/node_modules/.bin/prettier --check .
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-addons
          path: |
            libs/ts/addons/playwright-report
            libs/ts/addons/test-results
          if-no-files-found: ignore

  extension:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            libs/ts/pipeup/package-lock.json
            libs/ts/addons/package-lock.json
            apps/extension/package-lock.json
      # The extension carries the release's own Pipeup file and add-ons, built here.
      - run: npm ci && npm run build
        working-directory: libs/ts/pipeup
      - run: npm ci && npm run build
        working-directory: libs/ts/addons
      - run: npm ci
        working-directory: apps/extension
      - run: npx playwright install --with-deps chromium && npm run firefox
        working-directory: apps/extension
      - run: ../../libs/ts/pipeup/node_modules/.bin/prettier --check .
        working-directory: apps/extension
      - run: npm run check
        working-directory: apps/extension
      # Safari's package, as the stores get it: it asks for every website up front (one question, once; spec §3) and
      # carries the release's version. A branch without that line once shipped a Safari build that lost the press.
      - name: Safari's manifest asks once and names the release
        working-directory: apps/extension
        run: |
          node -e '
            const m = require("./dist/safari/manifest.json");
            const v = require("../../libs/ts/pipeup/package.json").version;
            if (JSON.stringify(m.host_permissions) !== JSON.stringify(["<all_urls>"]))
              throw new Error("safari manifest: host_permissions is " + JSON.stringify(m.host_permissions) + ", not <all_urls>");
            if (m.optional_host_permissions) throw new Error("safari manifest: optional_host_permissions should be gone");
            if (m.version !== v.replace(/-.*/, "")) throw new Error("safari manifest: version " + m.version + " is not the release " + v);
            console.log("safari manifest " + m.version + ": asks for every website once");
          '
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-extension
          path: |
            apps/extension/playwright-report
            apps/extension/test-results
          if-no-files-found: ignore
