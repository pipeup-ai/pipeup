name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: libs/ts/pipeup
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Node 24 ships npm 11, which trusted publishing needs (11.5.1 or later).
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: libs/ts/pipeup/package-lock.json

      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check

      - name: Release notes (CHANGELOG section and SRI)
        run: |
          sri="$(node scripts/sri.mjs)"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { exit }
            on { print }
          ' ../../../CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          {
            echo
            echo "## Install"
            echo
            echo '```sh'
            echo "npm i pipeup@$VERSION"
            echo '```'
            echo
            echo '```html'
            echo "<script src=\"https://cdn.jsdelivr.net/npm/pipeup@$VERSION/dist/pipeup.min.js\" integrity=\"$sri\" crossorigin=\"anonymous\"></script>"
            echo '```'
            echo
            echo "SRI for \`dist/pipeup.min.js\`: \`$sri\`"
          } >> "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      # Trusted publishing: npm accepts this workflow's short-lived GitHub identity (id-token: write
      # above) in place of a stored token. Set on npmjs.com under the package's Trusted Publisher.
      - name: Publish to npm
        run: |
          tag=latest
          case "$VERSION" in *-*) tag=next ;; esac
          npm publish --provenance --access public --tag "$tag"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag ${prerelease:+"$prerelease"}
