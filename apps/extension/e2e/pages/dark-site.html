<!doctype html>
<html lang="en" style="color-scheme: dark">
  <head>
    <meta charset="utf-8" />
    <title>A dark site with white links</title>
    <style>
      html,
      body {
        margin: 0;
        background: #202124;
        color: #e8eaed;
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
      main {
        max-width: 640px;
        margin: 0 auto;
        padding: 48px 24px;
      }
      a {
        color: #e8eaed;
      }
    </style>
  </head>
  <body>
    <main>
      <p><a href="#">A white link, as on a dark site.</a></p>
      <p id="p1">The first paragraph, on a dark background with light words.</p>
      <p id="p2">The second paragraph.</p>
    </main>
  </body>
</html>
