<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pipeup</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icons/32.png" width="22" height="22" alt="" />
      <div>
        <b>Pipeup</b>
        <span id="where">This page</span>
      </div>
    </header>
    <main id="main" aria-live="polite">
      <section id="off" hidden>
        <button id="start" class="main" type="button">Comment on this page</button>
      </section>
      <section id="on" hidden>
        <p id="count"></p>
        <button id="stop" class="main quiet" type="button">Turn off on this page</button>
      </section>
      <section id="always-row" class="row" hidden>
        <label for="always">
          <span id="always-label">Always on for this site</span>
          <small>Pipeup starts whenever you open it</small>
        </label>
        <input id="always" type="checkbox" role="switch" />
      </section>
      <p id="built-in" hidden>
        This page has Pipeup built in, so the extension stays out of the way. Its comments go where the page's
        author chose.
      </p>
      <p id="blocked" hidden>
        Pipeup can't run here. Browsers keep their own pages, like settings, the new tab page and their
        stores, closed to extensions.
      </p>
    </main>
    <footer>
      <span id="keys">Shortcut <kbd>⇧⌥P</kbd></span>
      <a id="mine" href="comments.html" target="_blank">Comments you've made</a>
    </footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
