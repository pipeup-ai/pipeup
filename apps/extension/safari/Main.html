<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="stylesheet" href="../Style.css" />
    <script src="../Script.js" defer></script>
  </head>
  <body>
    <!-- One window, three states (unknown, on, off). The drawing, the line and the button swap; nothing else moves.
         Design note: docs/design/safari-app-window.md. -->
    <main class="front">
      <div class="scenes" aria-hidden="true">
        <!-- Not on yet, or off: Safari's Extensions pane, Pipeup's row with an empty tick. -->
        <svg class="scene scene-settings" viewBox="0 0 320 180">
          <rect x="1" y="1" width="318" height="178" rx="10" fill="var(--paper)" stroke="var(--pen-soft)" />
          <rect x="1" y="1" width="318" height="40" rx="10" fill="var(--sheet)" />
          <rect x="1" y="26" width="318" height="15" fill="var(--sheet)" />
          <circle cx="16" cy="20" r="4" fill="var(--pen-soft)" />
          <circle cx="28" cy="20" r="4" fill="var(--pen-soft)" />
          <circle cx="40" cy="20" r="4" fill="var(--pen-soft)" />
          <rect x="120" y="13" width="80" height="6" rx="3" fill="var(--pen-soft)" />
          <rect x="150" y="30" width="46" height="2" rx="1" fill="var(--accent)" />
          <rect x="14" y="56" width="110" height="110" rx="8" fill="var(--sheet)" stroke="var(--pen-soft)" />
          <rect x="26" y="70" width="60" height="5" rx="2.5" fill="var(--pen-soft)" />
          <rect x="26" y="90" width="11" height="11" rx="3" fill="var(--accent)" />
          <path
            d="M28.5 95.5l2.5 2.5 4.5-5"
            fill="none"
            stroke="#fff"
            stroke-width="1.6"
            stroke-linecap="round"
          />
          <rect x="43" y="92" width="50" height="6" rx="3" fill="var(--pen)" opacity=".5" />
          <rect
            x="26"
            y="112"
            width="11"
            height="11"
            rx="3"
            fill="none"
            stroke="var(--accent)"
            stroke-width="1.6"
          />
          <path
            d="M44 123a5 5 0 0 1 5-5 5 5 0 0 1 5 5c0 2.8-2.2 5-5 5h-4.5l1-1.9a5 5 0 0 1-1.5-3.1z"
            fill="none"
            stroke="var(--accent)"
            stroke-width="1.4"
          />
          <rect x="58" y="114" width="36" height="6" rx="3" fill="var(--pen)" />
          <rect x="138" y="56" width="168" height="110" rx="8" fill="var(--sheet)" stroke="var(--pen-soft)" />
          <rect x="152" y="70" width="70" height="7" rx="3" fill="var(--pen)" />
          <rect x="152" y="86" width="130" height="5" rx="2.5" fill="var(--pen-soft)" />
          <rect x="152" y="97" width="104" height="5" rx="2.5" fill="var(--pen-soft)" />
          <rect x="152" y="118" width="118" height="5" rx="2.5" fill="var(--pen-soft)" />
          <rect x="152" y="129" width="90" height="5" rx="2.5" fill="var(--pen-soft)" />
        </svg>
        <!-- On: a page with Pipeup's button pressed and one comment on a paragraph. -->
        <svg class="scene scene-page" viewBox="0 0 320 180">
          <rect x="1" y="1" width="318" height="178" rx="10" fill="var(--paper)" stroke="var(--pen-soft)" />
          <rect x="1" y="1" width="318" height="36" rx="10" fill="var(--sheet)" />
          <rect x="1" y="22" width="318" height="15" fill="var(--sheet)" />
          <circle cx="16" cy="19" r="4" fill="var(--pen-soft)" />
          <circle cx="28" cy="19" r="4" fill="var(--pen-soft)" />
          <circle cx="40" cy="19" r="4" fill="var(--pen-soft)" />
          <rect x="112" y="11" width="140" height="16" rx="5" fill="var(--paper)" stroke="var(--pen-soft)" />
          <rect x="74" y="9" width="24" height="20" rx="6" fill="var(--accent-soft)" stroke="var(--accent)" />
          <path
            d="M86 13.5a4.5 4.5 0 0 1 4.5 4.5c0 2.5-2 4.5-4.5 4.5h-4l.9-1.7A4.5 4.5 0 0 1 86 13.5z"
            fill="none"
            stroke="var(--accent)"
            stroke-width="1.4"
          />
          <rect x="40" y="58" width="150" height="7" rx="3" fill="var(--pen)" />
          <rect
            x="40"
            y="80"
            width="200"
            height="32"
            rx="4"
            fill="var(--accent-soft)"
            stroke="var(--accent)"
          />
          <rect x="48" y="88" width="170" height="5" rx="2.5" fill="var(--accent-ink)" />
          <rect x="48" y="99" width="120" height="5" rx="2.5" fill="var(--accent-ink)" />
          <path d="M252 82a8 8 0 1 1-8 8l0 8z" fill="var(--accent)" />
          <rect x="40" y="126" width="190" height="5" rx="2.5" fill="var(--pen-soft)" />
          <rect x="40" y="138" width="160" height="5" rx="2.5" fill="var(--pen-soft)" />
          <rect x="40" y="150" width="175" height="5" rx="2.5" fill="var(--pen-soft)" />
        </svg>
      </div>

      <p class="state">
        <b class="state-unknown">Turn on Pipeup in Safari.</b>
        <b class="state-on">Pipeup is on in Safari.</b>
        <b class="state-off">Pipeup is off in Safari.</b>
        <span class="state-unknown">Under Extensions, tick Pipeup.</span>
        <span class="state-on">Press its button on any page.</span>
        <span class="state-off">Under Extensions, tick Pipeup to turn it back on.</span>
      </p>

      <button class="open-preferences state-unknown" type="button">Open Safari Settings</button>
      <button class="open-preferences state-off" type="button">Open Safari Settings</button>
      <button class="open-sample state-on" type="button">Try it on a sample page</button>

      <p class="links">
        <a href="https://pipeup-ai.github.io/pipeup/support.html">Support</a>
        <a href="https://pipeup-ai.github.io/pipeup/privacy.html">Privacy</a>
        <a href="https://github.com/pipeup-ai/pipeup">Source</a>
        <a href="#licences" class="show-licences">Licences</a>
      </p>
    </main>

    <!-- The MIT licence and third-party notices, filled in by tools/build-extension.mjs from the package. -->
    <section class="licences" hidden>
      <p class="links"><a href="#" class="hide-licences">‹ Back</a></p>
      <h1>Licences</h1>
      <pre><!--LICENCES--></pre>
    </section>
  </body>
</html>
