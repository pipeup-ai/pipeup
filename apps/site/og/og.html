<!doctype html>
<!-- The link-preview image (og.png, 1200×630): rendered by og/render.mjs, never served as a page.
     Only the mark and the name, centred inside the middle 630×630 square, so a square crop (Slack's
     thumbnail) never cuts it.
     Light only, in the site's colours and font. Edit this, then run `node apps/site/og/render.mjs`. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pipeup link preview</title>
    <style>
      @font-face { font-family: "Geist"; src: url("../fonts/geist.woff2") format("woff2"); font-weight: 400 600; }
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #ffffff; }
      body { display: grid; place-items: center; font-family: "Geist", sans-serif; -webkit-font-smoothing: antialiased; }
      .mark { display: flex; align-items: center; gap: 24px; }
      .mark svg { display: block; }
      .name { font-size: 104px; font-weight: 600; letter-spacing: -0.05em; color: #111111; line-height: 1; }
    </style>
  </head>
  <body>
    <div class="mark">
      <svg width="108" height="108" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 11.5a8 8 0 0 1-11.7 7.1L4 19.8l1.2-4.4A8 8 0 1 1 20.5 11.5z" /></svg>
      <span class="name">Pipeup</span>
    </div>
  </body>
</html>
