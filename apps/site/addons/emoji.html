<!-- emoji -->
<section class="addon plain" data-pipeup-id="emoji">
  <div class="text">
    <h2>Emoji</h2>
    <p class="one">The full set of emoji for reactions: search, the groups phones use, recently used and a skin tone.</p>
    <p class="fact"><b>Sends</b> Nothing. The emoji are part of the script.</p>
    <p class="fact"><b>Asks first</b> Nothing to ask: it only adds a More button to the row of reactions Pipeup already offers.</p>

      <button class="btn primary" type="button" data-copy="emoji-prompt"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2" /><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" /></svg><svg class="ok" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg><span class="label">Copy prompt</span></button>

    </div>
  </div>
</section>
