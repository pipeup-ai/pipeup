<!-- voice -->
<section class="addon" data-pipeup-id="voice">
  <div class="text">
    <h2>Voice</h2>
    <p class="one">Dictate a comment instead of typing it.</p>
    <p class="fact"><b>Sends</b> Nothing of its own. Your browser's speech engine does the listening.</p>
    <p class="fact"><b>Asks first</b> A short note, then the browser's own microphone prompt.</p>
    <div class="actions">
      <button class="btn primary" type="button" data-copy="voice-prompt"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2" /><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" /></svg><svg class="ok" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg><span class="label">Copy prompt</span></button>
      <button class="btn" type="button" data-copy="voice-tag"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2" /><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" /></svg><svg class="ok" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg><span class="label">Copy script tag</span></button>
      <a class="btn" href="try/voice.html">Try it</a>
    </div>
  </div>
  <div class="demo" data-len="10000" data-steps='[[700,"s1"],[1800,"s2"],[2800,"s3"],[6600,"s4"],[8000,"s5"]]' data-type="3200,6400" aria-hidden="true">
    <div class="stage vo">
      <div class="w"><div class="dots"><i></i><i></i><i></i></div><div class="ln" style="top:42px;width:170px"></div><div class="ln" style="top:58px;width:210px"></div><div class="hl"></div><div class="ln" style="top:96px;width:190px"></div><div class="ln" style="top:112px;width:230px"></div><div class="ln" style="top:128px;width:120px"></div><div class="pin"></div></div>
      <div class="cb" data-say="Move this chart above the table."><div class="who"><span class="av" style="background:#fdebd3"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#d97a1e" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="13" r="6"/><circle cx="7.5" cy="7.5" r="1.8"/><circle cx="16.5" cy="7.5" r="1.8"/></svg></span><b>Owl</b><span class="ago">just now</span><span class="acts"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18a9 9 0 0 0 0-18z" /><path d="M8.5 14a4.5 4.5 0 0 0 7 0" /><path d="M9 9.6h.01M15 9.6h.01" /></svg><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 12h.01M12 12h.01M18.5 12h.01" /></svg></span></div><div class="txt"></div>
        <span class="mic"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span>
        <span class="wave"><i></i><i></i><i></i><i></i></span><span class="state">Listening…</span></div>
      <span class="cursor" aria-hidden="true"><svg width="18" height="20" viewBox="0 0 18 20"><path d="M2 1.5l13 7.4-5.6 1.4-2.9 5.4z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round" /></svg></span>
    </div></div>
</section>
