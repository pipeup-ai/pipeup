<svg width="680" height="460" viewBox="0 0 680 460" role="img" xmlns="http://www.w3.org/2000/svg"><title>How a comment stays attached</title><defs><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#888780"/></marker></defs><rect width="680" height="460" fill="#FFFFFF"/><g font-family="-apple-system, Helvetica, Arial, sans-serif"><text x="40" y="48" font-size="14" font-weight="500" fill="#2C2C2A">Each comment stores several fingerprints</text><text x="640" y="48" text-anchor="end" font-size="12" fill="#5F5E5A">strongest first</text><rect x="40" y="64" width="300" height="48" rx="6" fill="#EEEDFE" stroke="#534AB7"/><text x="56" y="84" font-size="14" font-weight="500" fill="#3C3489">1  Stable id</text><text x="56" y="102" font-size="12" fill="#534AB7">data-pipeup-id, set by author or agent</text><rect x="40" y="120" width="300" height="48" rx="6" fill="#EEEDFE" stroke="#534AB7"/><text x="56" y="140" font-size="14" font-weight="500" fill="#3C3489">2  Quoted text + neighbours</text><text x="56" y="158" font-size="12" fill="#534AB7">survives edits around it</text><rect x="40" y="176" width="300" height="48" rx="6" fill="#EEEDFE" stroke="#534AB7"/><text x="56" y="196" font-size="14" font-weight="500" fill="#3C3489">3  Element path</text><text x="56" y="214" font-size="12" fill="#534AB7">survives text rewrites</text><rect x="40" y="232" width="300" height="48" rx="6" fill="#EEEDFE" stroke="#534AB7"/><text x="56" y="252" font-size="14" font-weight="500" fill="#3C3489">4  Spot inside the element</text><text x="56" y="270" font-size="12" fill="#534AB7">charts, canvas, images (x, y as %)</text><rect x="40" y="288" width="300" height="48" rx="6" fill="#EEEDFE" stroke="#534AB7"/><text x="56" y="308" font-size="14" font-weight="500" fill="#3C3489">5  Snapshot + view state</text><text x="56" y="326" font-size="12" fill="#534AB7">what they saw, which tab or slide</text><line x1="344" y1="200" x2="396" y2="150" stroke="#888780" stroke-width="1.5" marker-end="url(#a2)"/><rect x="400" y="110" width="240" height="64" rx="6" fill="#F1EFE8" stroke="#888780"/><text x="520" y="136" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">Page changes</text><text x="520" y="156" text-anchor="middle" font-size="12" fill="#5F5E5A">re-render, new data, new route</text><line x1="520" y1="174" x2="520" y2="200" stroke="#888780" stroke-width="1.5" marker-end="url(#a2)"/><rect x="400" y="204" width="240" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56"/><text x="416" y="231" font-size="14" font-weight="500" fill="#085041">Attached</text><text x="490" y="231" font-size="12" fill="#0F6E56">same spot, nothing to do</text><rect x="400" y="256" width="240" height="44" rx="6" fill="#FAEEDA" stroke="#854F0B"/><text x="416" y="283" font-size="14" font-weight="500" fill="#633806">Moved</text><text x="474" y="283" font-size="12" fill="#854F0B">found nearby, flagged</text><rect x="400" y="308" width="240" height="44" rx="6" fill="#F1EFE8" stroke="#5F5E5A"/><text x="416" y="335" font-size="14" font-weight="500" fill="#2C2C2A">Orphaned</text><text x="490" y="335" font-size="12" fill="#5F5E5A">kept in panel + snapshot</text><rect x="40" y="376" width="600" height="48" rx="6" fill="#FFFFFF" stroke="#D3D1C7"/><text x="340" y="397" text-anchor="middle" font-size="12" fill="#2C2C2A">Highlights are painted by the browser (CSS Custom Highlight API); the UI lives in its own layer.</text><text x="340" y="414" text-anchor="middle" font-size="12" fill="#5F5E5A">The page's own HTML is never rewritten, so React, Vue or a slide engine can't break it or be broken by it.</text></g></svg>
