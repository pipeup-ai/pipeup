<svg width="680" height="600" viewBox="0 0 680 600" role="img" xmlns="http://www.w3.org/2000/svg"><title>Pipeup architecture</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#888780"/></marker></defs><rect x="0" y="0" width="680" height="600" fill="#FFFFFF"/><g font-family="-apple-system, Helvetica, Arial, sans-serif"><rect x="40" y="40" width="130" height="56" rx="6" fill="#F1EFE8" stroke="#888780"/><text x="105" y="64" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">HTML doc</text><text x="105" y="82" text-anchor="middle" font-size="12" fill="#5F5E5A">reports, specs</text><rect x="190" y="40" width="130" height="56" rx="6" fill="#F1EFE8" stroke="#888780"/><text x="255" y="64" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">HTML slides</text><text x="255" y="82" text-anchor="middle" font-size="12" fill="#5F5E5A">decks, reveal.js</text><rect x="340" y="40" width="130" height="56" rx="6" fill="#F1EFE8" stroke="#888780"/><text x="405" y="64" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">Any web page</text><text x="405" y="82" text-anchor="middle" font-size="12" fill="#5F5E5A">prototypes, staging</text><rect x="490" y="40" width="130" height="56" rx="6" fill="#FFFFFF" stroke="#888780" stroke-dasharray="4 3"/><text x="555" y="64" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">Images, PDF</text><text x="555" y="82" text-anchor="middle" font-size="12" fill="#5F5E5A">later</text><line x1="340" y1="100" x2="340" y2="146" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/><text x="352" y="128" font-size="12" fill="#5F5E5A">one script tag (CDN, npm, or inlined)</text><rect x="40" y="150" width="600" height="190" rx="10" fill="#FBFAFF" stroke="#AFA9EC"/><text x="60" y="176" font-size="14" font-weight="500" fill="#3C3489">Pipeup library — runs inside the shared page</text><rect x="56" y="190" width="176" height="72" rx="6" fill="#EEEDFE" stroke="#534AB7"/><text x="144" y="220" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">UI kit</text><text x="144" y="240" text-anchor="middle" font-size="12" fill="#534AB7">pins, threads, presence</text><rect x="248" y="190" width="176" height="72" rx="6" fill="#EEEDFE" stroke="#534AB7"/><text x="336" y="220" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">Core</text><text x="336" y="240" text-anchor="middle" font-size="12" fill="#534AB7">anchors, model, events</text><rect x="440" y="190" width="176" height="72" rx="6" fill="#EEEDFE" stroke="#534AB7"/><text x="528" y="220" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">Storage adapters</text><text x="528" y="240" text-anchor="middle" font-size="12" fill="#534AB7">local, file, relay</text><rect x="56" y="280" width="560" height="44" rx="6" fill="#FAEEDA" stroke="#854F0B"/><text x="336" y="307" text-anchor="middle" font-size="12" fill="#633806">Hardening: isolated UI, plain-text comments, no eval, signed + hash-pinned builds</text><line x1="144" y1="340" x2="144" y2="396" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/><line x1="336" y1="340" x2="336" y2="396" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/><line x1="528" y1="340" x2="528" y2="396" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/><rect x="56" y="400" width="176" height="60" rx="6" fill="#E1F5EE" stroke="#0F6E56"/><text x="144" y="425" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">This browser</text><text x="144" y="444" text-anchor="middle" font-size="12" fill="#0F6E56">private, offline</text><rect x="248" y="400" width="176" height="60" rx="6" fill="#E1F5EE" stroke="#0F6E56"/><text x="336" y="425" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">Feedback file</text><text x="336" y="444" text-anchor="middle" font-size="12" fill="#0F6E56">q3.pipeup.json</text><rect x="440" y="400" width="176" height="60" rx="6" fill="#E1F5EE" stroke="#0F6E56"/><text x="528" y="425" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">Author's relay</text><text x="528" y="444" text-anchor="middle" font-size="12" fill="#0F6E56">Cloudflare, rooms</text><line x1="336" y1="460" x2="336" y2="496" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/><line x1="528" y1="460" x2="528" y2="496" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/><rect x="56" y="500" width="560" height="60" rx="6" fill="#FAECE7" stroke="#993C1D"/><text x="336" y="525" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">Agent skills + CLI</text><text x="336" y="544" text-anchor="middle" font-size="12" fill="#993C1D">integrate, check, summarise feedback, reply, apply fixes</text></g></svg>
