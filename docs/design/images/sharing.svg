<svg width="680" height="370" viewBox="0 0 680 370" role="img" xmlns="http://www.w3.org/2000/svg"><title>Sharing through an untrusted relay</title><defs><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888780"/></marker></defs><rect width="680" height="370" fill="#FFFFFF"/><g font-family="-apple-system, Helvetica, Arial, sans-serif"><rect x="40" y="50" width="170" height="70" rx="6" fill="#EEEDFE" stroke="#534AB7"/><text x="125" y="80" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">Reviewer</text><text x="125" y="100" text-anchor="middle" font-size="12" fill="#534AB7">encrypts in browser</text><rect x="255" y="50" width="170" height="70" rx="6" fill="#F1EFE8" stroke="#888780"/><text x="340" y="80" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">Relay</text><text x="340" y="100" text-anchor="middle" font-size="12" fill="#5F5E5A">sees only ciphertext</text><rect x="470" y="50" width="170" height="70" rx="6" fill="#EEEDFE" stroke="#534AB7"/><text x="555" y="80" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">Author</text><text x="555" y="100" text-anchor="middle" font-size="12" fill="#534AB7">decrypts in browser</text><line x1="214" y1="85" x2="251" y2="85" stroke="#888780" stroke-width="1.5" marker-start="url(#a3)" marker-end="url(#a3)"/><line x1="429" y1="85" x2="466" y2="85" stroke="#888780" stroke-width="1.5" marker-start="url(#a3)" marker-end="url(#a3)"/><path d="M125 120 L125 150 L555 150 L555 124" fill="none" stroke="#854F0B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a3)"/><rect x="150" y="162" width="380" height="44" rx="6" fill="#FAEEDA" stroke="#854F0B"/><text x="340" y="181" text-anchor="middle" font-size="12" fill="#633806">Invite: deck.html#room=…&amp;key=…  (or built into the file)</text><text x="340" y="198" text-anchor="middle" font-size="12" fill="#854F0B">the part after # never leaves the browser</text><text x="40" y="244" font-size="14" font-weight="500" fill="#2C2C2A">Ways to share — first release in bold outline</text><rect x="40" y="260" width="130" height="64" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="2.5"/><text x="105" y="286" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">Feedback file</text><text x="105" y="306" text-anchor="middle" font-size="12" fill="#0F6E56">no network</text><rect x="190" y="260" width="130" height="64" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="2.5"/><text x="255" y="286" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">Your Cloudflare</text><text x="255" y="306" text-anchor="middle" font-size="12" fill="#0F6E56">one step, free tier</text><rect x="340" y="260" width="130" height="64" rx="6" fill="#FFFFFF" stroke="#0F6E56" stroke-dasharray="4 3"/><text x="405" y="286" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">Peer to peer</text><text x="405" y="306" text-anchor="middle" font-size="12" fill="#0F6E56">later, live only</text><rect x="490" y="260" width="130" height="64" rx="6" fill="#FFFFFF" stroke="#0F6E56" stroke-dasharray="4 3"/><text x="555" y="286" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">Other hosts</text><text x="555" y="306" text-anchor="middle" font-size="12" fill="#0F6E56">later, adapters</text></g></svg>
