<svg width="680" height="450" viewBox="0 0 680 450" role="img" xmlns="http://www.w3.org/2000/svg"><title>Relay security model</title><defs><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#888780"/></marker></defs><rect width="680" height="450" fill="#FFFFFF"/><g font-family="-apple-system, Helvetica, Arial, sans-serif"><rect x="40" y="40" width="170" height="70" rx="6" fill="#EEEDFE" stroke="#534AB7"/><text x="125" y="70" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">Reviewer's browser</text><text x="125" y="90" text-anchor="middle" font-size="12" fill="#534AB7">writes a comment</text><line x1="212" y1="75" x2="246" y2="75" stroke="#888780" stroke-width="1.5" marker-end="url(#a5)"/><rect x="250" y="40" width="180" height="70" rx="6" fill="#FAEEDA" stroke="#854F0B"/><text x="340" y="70" text-anchor="middle" font-size="14" font-weight="500" fill="#633806">Encrypt + sign</text><text x="340" y="90" text-anchor="middle" font-size="12" fill="#854F0B">keys never leave device</text><line x1="432" y1="75" x2="466" y2="75" stroke="#888780" stroke-width="1.5" marker-end="url(#a5)"/><rect x="470" y="40" width="170" height="70" rx="6" fill="#F1EFE8" stroke="#888780"/><text x="555" y="70" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">Your Cloudflare relay</text><text x="555" y="90" text-anchor="middle" font-size="12" fill="#5F5E5A">Worker + Durable Object</text><rect x="40" y="140" width="290" height="176" rx="8" fill="#F1EFE8" stroke="#888780"/><text x="60" y="168" font-size="14" font-weight="500" fill="#2C2C2A">The relay can see</text><text x="60" y="198" font-size="12" fill="#444441">a random room id</text><text x="60" y="224" font-size="12" fill="#444441">encrypted blobs and their sizes</text><text x="60" y="250" font-size="12" fill="#444441">when people connect, how many</text><text x="60" y="276" font-size="12" fill="#444441">IP addresses (so can Cloudflare)</text><text x="60" y="302" font-size="12" fill="#888780">metadata only</text><rect x="350" y="140" width="290" height="176" rx="8" fill="#E1F5EE" stroke="#0F6E56"/><text x="370" y="168" font-size="14" font-weight="500" fill="#085041">It never sees</text><text x="370" y="198" font-size="12" fill="#085041">comment text and replies</text><text x="370" y="224" font-size="12" fill="#085041">names, avatars, cursors</text><text x="370" y="250" font-size="12" fill="#085041">quoted text and anchors</text><text x="370" y="276" font-size="12" fill="#085041">the document itself</text><text x="370" y="302" font-size="12" fill="#0F6E56">all encrypted before upload</text><rect x="40" y="346" width="186" height="64" rx="6" fill="#EEEDFE" stroke="#534AB7"/><text x="133" y="372" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">Room tokens</text><text x="133" y="392" text-anchor="middle" font-size="12" fill="#534AB7">only invited people write</text><rect x="247" y="346" width="186" height="64" rx="6" fill="#EEEDFE" stroke="#534AB7"/><text x="340" y="372" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">Signatures</text><text x="340" y="392" text-anchor="middle" font-size="12" fill="#534AB7">nobody can impersonate</text><rect x="454" y="346" width="186" height="64" rx="6" fill="#EEEDFE" stroke="#534AB7"/><text x="547" y="372" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">Limits + expiry</text><text x="547" y="392" text-anchor="middle" font-size="12" fill="#534AB7">no flooding, no surprise bill</text></g></svg>
