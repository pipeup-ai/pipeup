<svg width="820" height="720" viewBox="0 0 820 720" role="img" xmlns="http://www.w3.org/2000/svg"><title>Pipeup add-ons architecture</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#888780"/></marker></defs><rect x="0" y="0" width="820" height="720" fill="#FFFFFF"/><g font-family="-apple-system, Helvetica, Arial, sans-serif">
<rect x="40" y="30" width="520" height="64" rx="6" fill="#F1EFE8" stroke="#888780"/><text x="60" y="54" font-size="14" font-weight="500" fill="#2C2C2A">page.html — opened from disk or served, no build step</text><text x="60" y="76" font-size="12" fill="#5F5E5A" font-family="ui-monospace, Menlo, monospace">pipeup.min.js  share.min.js  voice.min.js  live.min.js</text>
<rect x="580" y="30" width="200" height="64" rx="6" fill="#FFFFFF" stroke="#888780"/><text x="680" y="52" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">Author's command line</text><text x="680" y="70" text-anchor="middle" font-size="11" fill="#5F5E5A" font-family="ui-monospace, Menlo, monospace">share create · stop · update</text><text x="680" y="86" text-anchor="middle" font-size="11" fill="#5F5E5A">writes the shared address</text>
<line x1="300" y1="94" x2="300" y2="118" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/><text x="312" y="111" font-size="12" fill="#5F5E5A">any script order; or one combined file pipeup+share.min.js</text>
<rect x="40" y="122" width="740" height="196" rx="10" fill="#FBFAFF" stroke="#AFA9EC"/><text x="60" y="146" font-size="14" font-weight="500" fill="#3C3489">Pipeup core — comments, local storage, UI · never touches the network</text>
<rect x="56" y="160" width="220" height="144" rx="6" fill="#EEEDFE" stroke="#534AB7"/><text x="166" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">Data slots · stage 0</text><text x="166" y="208" text-anchor="middle" font-size="12" fill="#534AB7" font-family="ui-monospace, Menlo, monospace">ops · merge · onChange</text><text x="166" y="232" text-anchor="middle" font-size="12" fill="#534AB7">in every bundle, and in</text><text x="166" y="248" text-anchor="middle" font-size="12" fill="#534AB7">pipeup/core for the CLI</text><text x="166" y="276" text-anchor="middle" font-size="12" fill="#534AB7">every incoming op checked</text><text x="166" y="292" text-anchor="middle" font-size="12" fill="#534AB7">like a feedback file</text>
<rect x="292" y="160" width="220" height="144" rx="6" fill="#EEEDFE" stroke="#534AB7"/><text x="402" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">Registry · stage 1</text><text x="402" y="208" text-anchor="middle" font-size="12" fill="#534AB7" font-family="ui-monospace, Menlo, monospace">self.pipeupAddons</text><text x="402" y="226" text-anchor="middle" font-size="12" fill="#534AB7">queue, or use() from ESM</text><text x="402" y="252" text-anchor="middle" font-size="12" fill="#534AB7">ADDON_API · needs</text><text x="402" y="276" text-anchor="middle" font-size="12" fill="#534AB7">addons(): on or off,</text><text x="402" y="292" text-anchor="middle" font-size="12" fill="#534AB7">with the reason in words</text>
<rect x="528" y="160" width="236" height="144" rx="6" fill="#EEEDFE" stroke="#534AB7"/><text x="646" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">Host slots, one host per add-on</text><text x="544" y="212" font-size="12" font-weight="500" fill="#3C3489">1</text><text x="560" y="212" font-size="12" fill="#534AB7">menu · notify · announce · note</text><text x="544" y="240" font-size="12" font-weight="500" fill="#3C3489">2</text><text x="560" y="240" font-size="12" fill="#534AB7">composer tool · panel · styles</text><text x="544" y="268" font-size="12" font-weight="500" fill="#3C3489">3</text><text x="560" y="268" font-size="12" fill="#534AB7">status · overlay · here · sign</text><text x="646" y="292" text-anchor="middle" font-size="11" fill="#534AB7">each lands with its first add-on</text>
<line x1="410" y1="318" x2="410" y2="342" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/><text x="422" y="335" font-size="12" fill="#5F5E5A">addon.setup(host) — typed slots only, never Pipeup's private DOM</text>
<rect x="40" y="346" width="740" height="180" rx="10" fill="#F4FBF8" stroke="#9FE1CB"/><text x="60" y="370" font-size="14" font-weight="500" fill="#085041">Add-ons — the only code that sends anything, and each says what, to whom</text>
<rect x="56" y="382" width="165" height="76" rx="6" fill="#E1F5EE" stroke="#0F6E56"/><text x="138.5" y="406" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">share</text><text x="138.5" y="426" text-anchor="middle" font-size="12" fill="#0F6E56">stage 1 · 7.5 KB</text><text x="138.5" y="444" text-anchor="middle" font-size="12" fill="#0F6E56">encrypted shared copy</text>
<rect x="237" y="382" width="165" height="76" rx="6" fill="#E1F5EE" stroke="#0F6E56"/><text x="319.5" y="406" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">voice</text><text x="319.5" y="426" text-anchor="middle" font-size="12" fill="#0F6E56">stage 2 · 4 KB</text><text x="319.5" y="444" text-anchor="middle" font-size="12" fill="#0F6E56">microphone in the box</text>
<rect x="418" y="382" width="165" height="76" rx="6" fill="#E1F5EE" stroke="#0F6E56"/><text x="500.5" y="406" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">live</text><text x="500.5" y="426" text-anchor="middle" font-size="12" fill="#0F6E56">stage 3 · 14 KB</text><text x="500.5" y="444" text-anchor="middle" font-size="12" fill="#0F6E56">peers, presence, cursors</text>
<rect x="599" y="382" width="165" height="76" rx="6" fill="#FFFFFF" stroke="#0F6E56" stroke-dasharray="4 3"/><text x="681.5" y="406" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">relay</text><text x="681.5" y="426" text-anchor="middle" font-size="12" fill="#0F6E56">later</text><text x="681.5" y="444" text-anchor="middle" font-size="12" fill="#0F6E56">author-owned rooms</text>
<rect x="56" y="470" width="708" height="44" rx="6" fill="#FFFFFF" stroke="#0F6E56"/><text x="410" y="489" text-anchor="middle" font-size="12" font-weight="500" fill="#085041">Private kit, bundled into each add-on (costs the core nothing)</text><text x="410" y="506" text-anchor="middle" font-size="12" fill="#0F6E56">keys from the page secret · sealed envelope · Transport · SyncEngine · settings · presence</text>
<line x1="120" y1="526" x2="122" y2="586" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/><line x1="160" y1="526" x2="262" y2="586" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/><line x1="340" y1="526" x2="405" y2="586" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/><line x1="520" y1="526" x2="552" y2="586" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/><line x1="690" y1="526" x2="696" y2="586" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<rect x="56" y="590" width="132" height="80" rx="6" fill="#F1EFE8" stroke="#888780"/><text x="122" y="614" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A">PrivateBin</text><text x="122" y="634" text-anchor="middle" font-size="11" fill="#5F5E5A">any instance</text><text x="122" y="656" text-anchor="middle" font-size="11" font-weight="500" fill="#3C3489">spike S1</text>
<rect x="200" y="590" width="132" height="80" rx="6" fill="#F1EFE8" stroke="#888780"/><text x="266" y="614" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A">HTTP mailbox</text><text x="266" y="634" text-anchor="middle" font-size="11" fill="#5F5E5A">@pipeup/mailbox</text><text x="266" y="656" text-anchor="middle" font-size="11" font-weight="500" fill="#3C3489">spike S6</text>
<rect x="344" y="590" width="132" height="80" rx="6" fill="#F1EFE8" stroke="#888780"/><text x="410" y="614" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A">Speech engine</text><text x="410" y="634" text-anchor="middle" font-size="11" fill="#5F5E5A">on device, or vendor</text><text x="410" y="656" text-anchor="middle" font-size="11" font-weight="500" fill="#3C3489">spike S3</text>
<rect x="488" y="590" width="132" height="80" rx="6" fill="#F1EFE8" stroke="#888780"/><text x="554" y="614" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A">Nostr + STUN</text><text x="554" y="634" text-anchor="middle" font-size="11" fill="#5F5E5A">then WebRTC peers</text><text x="554" y="656" text-anchor="middle" font-size="11" font-weight="500" fill="#3C3489">spike S2</text>
<rect x="632" y="590" width="132" height="80" rx="6" fill="#FFFFFF" stroke="#888780" stroke-dasharray="4 3"/><text x="698" y="614" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A">services/relay</text><text x="698" y="634" text-anchor="middle" font-size="11" fill="#5F5E5A">rooms, TURN</text><text x="698" y="656" text-anchor="middle" font-size="11" fill="#5F5E5A">later</text>
<text x="40" y="694" font-size="11" fill="#5F5E5A">Share and live send sealed batches (AES-GCM): services hold ciphertext only. Voice sends nothing itself; the browser may, after consent.</text><text x="40" y="710" font-size="11" fill="#5F5E5A">Stage = when that slot lands in the core. Sizes are gzip budgets per add-on file. Dashed = later, not designed for the first release.</text>
</g></svg>
