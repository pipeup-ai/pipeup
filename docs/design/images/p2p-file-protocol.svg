<svg width="680" height="470" viewBox="0 0 680 470" role="img" xmlns="http://www.w3.org/2000/svg"><title>Peer to peer from file:// pages (deferred)</title><defs><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888780"/></marker></defs><rect width="680" height="470" fill="#FFFFFF"/><g font-family="-apple-system, Helvetica, Arial, sans-serif"><rect x="40" y="50" width="180" height="76" rx="6" fill="#EEEDFE" stroke="#534AB7"/><text x="130" y="80" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">Your laptop</text><text x="130" y="100" text-anchor="middle" font-size="12" fill="#534AB7">file://…/Desktop/q3.html</text><rect x="460" y="50" width="180" height="76" rx="6" fill="#EEEDFE" stroke="#534AB7"/><text x="550" y="80" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">Reviewer's laptop</text><text x="550" y="100" text-anchor="middle" font-size="12" fill="#534AB7">file://…/Downloads/q3.html</text><rect x="250" y="50" width="180" height="76" rx="6" fill="#F1EFE8" stroke="#888780"/><text x="340" y="80" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">Meeting point</text><text x="340" y="100" text-anchor="middle" font-size="12" fill="#5F5E5A">public relay (Nostr, MQTT)</text><line x1="222" y1="88" x2="248" y2="88" stroke="#888780" stroke-width="1.5" marker-start="url(#a4)" marker-end="url(#a4)"/><line x1="432" y1="88" x2="458" y2="88" stroke="#888780" stroke-width="1.5" marker-start="url(#a4)" marker-end="url(#a4)"/><text x="340" y="148" text-anchor="middle" font-size="12" fill="#2C2C2A">1  meet: swap connection details (a few KB, encrypted)</text><rect x="250" y="164" width="180" height="56" rx="6" fill="#F1EFE8" stroke="#888780"/><text x="340" y="188" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">STUN server</text><text x="340" y="207" text-anchor="middle" font-size="12" fill="#5F5E5A">2  "what's my address?"</text><line x1="190" y1="128" x2="250" y2="180" stroke="#888780" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#a4)"/><line x1="490" y1="128" x2="430" y2="180" stroke="#888780" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#a4)"/><line x1="100" y1="128" x2="100" y2="270" stroke="#0F6E56" stroke-width="3"/><line x1="580" y1="128" x2="580" y2="270" stroke="#0F6E56" stroke-width="3"/><line x1="100" y1="270" x2="580" y2="270" stroke="#0F6E56" stroke-width="3"/><text x="340" y="258" text-anchor="middle" font-size="12" fill="#085041">3  direct, encrypted channel: comments, cursors, presence</text><rect x="250" y="296" width="180" height="56" rx="6" fill="#FFFFFF" stroke="#888780" stroke-dasharray="4 3"/><text x="340" y="320" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">TURN relay</text><text x="340" y="339" text-anchor="middle" font-size="12" fill="#5F5E5A">fallback when blocked</text><line x1="340" y1="274" x2="340" y2="294" stroke="#888780" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="40" y="376" width="600" height="56" rx="6" fill="#FAEEDA" stroke="#854F0B"/><text x="340" y="399" text-anchor="middle" font-size="12" fill="#633806">Both people must have the page open at the same time.</text><text x="340" y="418" text-anchor="middle" font-size="12" fill="#854F0B">The two file paths differ, so the room id is written into the file, not taken from the URL.</text></g></svg>
